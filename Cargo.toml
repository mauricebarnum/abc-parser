[workspace]
members = ["abc-language-server", "abc-parser"]
resolver = "3"

[profile.dev]
debug = "full"

[profile.test]
debug = "line-tables-only"
incremental = true
opt-level = 0

# Use `cargo nextest run --cargo-profile test-debug` when tests need complete
# debugger information, including local variables.
[profile.test-debug]
inherits = "test"
debug = "full"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
clone_on_ref_ptr = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
