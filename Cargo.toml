[workspace]
members = ["abc-language-server"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
clone_on_ref_ptr = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"

[package]
name = "abc-parser"
version = "0.1.0"
publish = false
description = "A recovering, source-spanned parser for ABC music notation 2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
chumsky = "0.11.1"
clap = { version = "4.5.54", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
merman-rustdoc = "0.7.0"

[[bin]]
name = "abc-transpose"
path = "src/bin/abc-transpose.rs"
doc = true

[lints]
workspace = true
