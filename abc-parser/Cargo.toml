[package]
name = "abc-parser"
version = "0.1.0"
publish = false
description = "A recovering, source-spanned parser for ABC music notation 2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
chumsky = { version = "0.14.0", default-features = false, features = ["std"] }
aquamarine = { version = "0.6.0", optional = true }

[features]
default = []
doc-mermaid = ["dep:aquamarine"]

[[example]]
name = "kitchen_sink"
path = "examples/kitchen_sink.rs"
test = false

[[example]]
name = "transpose_kitchen_sink"
path = "examples/transpose_kitchen_sink.rs"
test = false

[lints]
workspace = true
