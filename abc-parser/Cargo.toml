[package]
name = "abc-parser"
version = "0.1.0"
publish = false
description = "A recovering, source-spanned parser for ABC music notation 2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
chumsky = { version = "0.13.0", default-features = false, features = ["std"] }
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
aquamarine = "0.6.0"

[package.metadata.cargo-machete]
ignored = ["aquamarine"]

[[bin]]
name = "abc-transpose"
path = "src/bin/abc-transpose.rs"
doc = true

[[bin]]
name = "abc-lint"
path = "src/bin/abc-lint.rs"
doc = true

[lints]
workspace = true
