[package]
name = "abc-lint"
version = "0.1.0"
publish = false
description = "Validates ABC 2.1 input and optionally emits deterministic fixes"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[[bin]]
name = "abc-lint"
path = "src/main.rs"

[dependencies]
abc-parser = { path = "../abc-parser", version = "0.1.0" }
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }

[lints]
workspace = true
