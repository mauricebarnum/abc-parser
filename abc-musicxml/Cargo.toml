[package]
name = "abc-musicxml"
version = "0.1.0"
publish = false
description = "Converts ABC 2.1 music notation to MusicXML 4.0 with optional source provenance annotations"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[lib]
name = "abc_musicxml"
path = "src/lib.rs"

[[bin]]
name = "abc-musicxml"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "kitchen_sink"
required-features = ["cli"]

[[test]]
name = "phase3_features"
required-features = ["cli"]

[[test]]
name = "version_flag"
required-features = ["cli"]

[dependencies]
abc-parser = { path = "../abc-parser", version = "0.1.0" }
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"], optional = true }
rayon = { version = "1.12.0", optional = true }
zip = { version = "9.5.1", default-features = false, features = ["deflate"], optional = true }

[lints]
workspace = true

[features]
default = ["cli", "mxl", "parallel"]
cli = ["dep:clap"]
mxl = ["dep:zip"]
parallel = ["dep:rayon"]
