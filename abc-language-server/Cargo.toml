[package]
name = "abc-language-server"
version = "0.1.0"
publish = false
description = "Language Server Protocol support for ABC music notation"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
abc-parser = { path = "../abc-parser" }
clap = { version = "4.6.4", default-features = false, features = ["derive", "help", "std", "usage"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = { version = "0.23", default-features = false, features = ["runtime-tokio"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
