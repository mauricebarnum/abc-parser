[package]
name = "abc-language-server"
version = "0.1.0"
publish = false
description = "Language Server Protocol support for ABC music notation"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
abc-parser = { path = "../abc-parser" }
clap = { version = "4.5.54", default-features = false, features = ["derive", "help", "std", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
