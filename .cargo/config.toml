# Suppress terminal notifications for future-incompatibility reports in upstream
# dependencies (such as proc-macro-error2). Detailed reports remain accessible
# on-demand via `cargo report future-incompatibilities`.
[future-incompat-report]
frequency = "never"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
